# ═══════════════════════════════════════════════════════
# MAVERIK STORE — Docker Compose
# Khởi động: docker compose up --build -d
# Dừng:      docker compose down
# Xóa data:  docker compose down -v
# ═══════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────
  # 1. DATABASE — MySQL 8.0
  # ────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: maverik_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maverik_store
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      MYSQL_CHARACTER_SET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - maverik_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────
  # 2. BACKEND — Node.js Express API
  # ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maverik_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      API_VERSION: v1
      # Database trỏ đến service "db" trong mạng Docker nội bộ
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      # JWT
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      JWT_EXPIRE: "7d"
      # Bcrypt
      BCRYPT_ROUNDS: "10"
      # CORS — Cho phép cả localhost:80 (frontend docker) và dev ports
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8080,http://localhost:3000,http://localhost:5173"
      # Supabase Storage (giữ nguyên cloud)
      SUPABASE_URL: "${SUPABASE_URL:?Set SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_STORAGE_BUCKET: "product-images"
      # Gemini AI
      GEMINI_API_KEY: "${GEMINI_API_KEY:?Set GEMINI_API_KEY}"
      GEMINI_MODEL: "gemini-2.5-flash"
      # VNPay Sandbox — URL trỏ về localhost (Docker expose port 5000 ra ngoài)
      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE:?Set VNPAY_TMN_CODE}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET:?Set VNPAY_HASH_SECRET}"
      VNPAY_RETURN_URL: "http://localhost:5000/api/v1/payments/vnpay/return"
      VNPAY_FRONTEND_RETURN: "http://localhost/vnpay-return.html"
      VNPAY_IPN_URL: "http://localhost:5000/api/v1/payments/vnpay/ipn"
      # Resend Email
      RESEND_API_KEY: "${RESEND_API_KEY:?Set RESEND_API_KEY}"
      OTP_SECRET: "${OTP_SECRET:?Set OTP_SECRET}"
      EMAIL_FROM: "Maverik Store <onboarding@resend.dev>"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maverik_net

  # ────────────────────────────────────────────────────
  # 3. FRONTEND — Nginx phục vụ Vite build
  # ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maverik_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - maverik_net

# ═══════════════════════════════════════════════════════
# VOLUMES — Lưu data MySQL bền vững qua các lần restart
# ═══════════════════════════════════════════════════════
volumes:
  mysql_data:
    driver: local

# ═══════════════════════════════════════════════════════
# NETWORKS — Mạng nội bộ giữa các container
# ═══════════════════════════════════════════════════════
networks:
  maverik_net:
    driver: bridge
