server {
    listen 80;
    server_name localhost;

    # Thư mục chứa static files từ Vite build
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Reverse Proxy: Chuyển /api/ → Backend container ──
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── WebSocket proxy (cho Support Chat) ──
    location /ws {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # ── Static files: Cache assets JS/CSS/Images ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Fallback: Phục vụ index.html cho các path không có file cụ thể ──
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Tắt log truy cập favicon (giảm noise)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
